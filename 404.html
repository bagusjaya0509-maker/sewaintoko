<script>
  // Halaman listing baru (/properti/<slug>-<kode>.html) dibangun berkala. Selama
  // belum dibangun, alihkan ke halaman detail dinamis supaya tautannya tidak putus.
  (function () {
    var m = location.pathname.match(/^\/properti\/[a-z0-9-]*?([a-z]{3}-\d{3})\.html$/);
    if (m) location.replace('/listing/?kode=' + m[1].toUpperCase());
  })();
</script>
